name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trimatch
          POSTGRES_PASSWORD: trimatch
          POSTGRES_DB: trimatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trimatch"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://trimatch:trimatch@127.0.0.1:5432/trimatch
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .. && uv run ruff format --check ..
      - name: Type-check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest --cov=app/core --cov-branch --cov-fail-under=90
